groups:
  - name: research-agent-availability
    rules:
      - alert: ResearchAgentApiUnavailable
        expr: up{job="research-agent-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ResearchAgent API metrics endpoint is unavailable

      - alert: ResearchAgentOutboxStalled
        expr: research_agent_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Durable Outbox dispatch is delayed

      - alert: ResearchAgentOutboxDispatchFailures
        expr: research_agent_outbox_attempts > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Pending Outbox events have failed dispatch attempts

      - alert: ResearchAgentExpiredChatLease
        expr: research_agent_chat_expired_leases > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A chat worker lease expired and requires recovery
