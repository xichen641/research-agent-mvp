[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xichen641", email = "2381670160@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.2",
    "docling>=2.113.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "minio>=7.2.20",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.51.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.0",
    "ruff>=0.15.21",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker-backed infrastructure",
]
